<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imperial Fiesta - Juniors Registration 2025</title>

    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="shortcut icon" href="https://png.pngtree.com/png-vector/20241211/ourmid/pngtree-cute-yellow-cartoon-star-clipart-illustration-png-image_14714901.png" type="image/x-icon">

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    />

 <style>
  /* --- Imperial Fiesta Theme for Forms --- */

  body {
    /* Consistent dark background from the main theme */
    background: #1a1a2e;
    font-family: "Poppins", sans-serif;
    color: #e5e7eb; /* Light gray text for readability */
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .card {
    /* Darker card with gold border, matching the theme's boxes */
    background-color: rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(10px);
    border-radius: 1rem;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    border: 2px solid #facc15; /* Gold border (Tailwind yellow-400) */
    overflow: hidden;
  }

  .input-field {
    background-color: rgba(0, 0, 0, 0.3);
    border: 1px solid #ca8a04; /* Darker gold border */
    color: #f3f4f6;
    border-radius: 0.5rem;
    padding: 0.75rem 1rem;
    transition: all 0.3s ease;
  }
  .input-field::placeholder {
    color: #9ca3af;
  }
  .input-field:focus {
    border-color: #facc15; /* Bright gold on focus */
    box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.2); /* Gold glow effect */
    outline: none;
  }
  .input-field.is-invalid {
    border-color: #ef4444;
  }
  .input-field.is-invalid:focus {
    box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
  }
  .error-message {
    color: #ef4444;
    font-size: 0.875rem;
    margin-top: 0.25rem;
  }

  .btn-primary {
    /* Gold button from the main theme */
    background: linear-gradient(to right, #facc15, #eab308);
    color: #1e1b4b; /* Dark text on gold button */
    font-weight: 700;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(250, 204, 21, 0.2);
    border: none;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(250, 204, 21, 0.3);
  }
  .btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: translateY(0);
    box-shadow: none;
  }
  .btn-secondary {
    /* Outline-style button for secondary actions */
    background-color: transparent;
    color: #facc15;
    border: 2px solid #facc15;
    transition: all 0.3s ease;
  }
  .btn-secondary:hover {
    background-color: rgba(250, 204, 21, 0.1);
    color: #fde047;
  }

  /* --- Stepper Component Theming --- */
  .stepper {
    display: flex;
    justify-content: space-between;
    position: relative;
    margin-bottom: 2rem;
  }
  .stepper::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background-color: #4b5563; /* Dark gray line */
    transform: translateY(-50%);
    z-index: 1;
  }
  .step-item {
    position: relative;
    z-index: 2;
    text-align: center;
  }
  .step-circle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background-color: #1a1a2e; /* Matches body background */
    border: 2px solid #4b5563; /* Dark gray border for inactive */
    color: #9ca3af;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    transition: all 0.4s ease;
  }
  .step-item.active .step-circle {
    background-color: #facc15; /* Gold background for active */
    border-color: #facc15;
    color: #1e1b4b; /* Dark text for active */
    transform: scale(1.1);
  }
  .step-title {
    font-size: 0.8rem;
    margin-top: 0.5rem;
    color: #9ca3af; /* Muted color for inactive title */
    transition: color 0.4s ease;
  }
  .step-item.active .step-title {
    color: #fde047; /* Bright gold for active title */
    font-weight: 600;
  }
</style>
  </head>

  <body class="min-h-screen flex flex-col items-center p-4">
    <header class="text-center text-white mb-6">
      <a href="home.html" class="text-4xl font-bold tracking-tight"
        >✨ Imperial Fiesta ✨</a
      >
      <p class="text-lg mt-2 opacity-90">Juniors Registration - 2025</p>
    </header>

    <main class="card w-full max-w-2xl">
      <form id="registerForm" novalidate>
        <div class="stepper p-6 border-b border-gray-200">
          <div class="step-item active" data-step="1">
            <div class="step-circle">1</div>
            <div class="step-title">Personal Info</div>
          </div>
          <div class="step-item" data-step="2">
            <div class="step-circle">2</div>
            <div class="step-title">Event Details</div>
          </div>
          <div class="step-item" data-step="3">
            <div class="step-circle"><i class="fas fa-check"></i></div>
            <div class="step-title">Finish</div>
          </div>
        </div>

        <div class="p-8">
          <!-- Step 1: Personal Info -->
          <div id="step-1" class="form-step space-y-4">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">
              Your Details
            </h3>
            <div>
              <label for="name" class="block font-semibold mb-1 text-gray-700"
                >Name *</label
              >
              <input
                type="text"
                id="name"
                class="w-full border rounded-lg p-3 input-field"
                placeholder="Enter your full name"
                required
              />
              <div
                id="name-error"
                class="error-message hidden"
                aria-live="polite"
              ></div>
            </div>
            <div>
              <label for="email" class="block font-semibold mb-1 text-gray-700"
                >Email *</label
              >
              <input
                type="email"
                id="email"
                class="w-full border rounded-lg p-3 input-field"
                placeholder="your.email@example.com"
                required
              />
              <div
                id="email-error"
                class="error-message hidden"
                aria-live="polite"
              ></div>
            </div>
            <div class="grid md:grid-cols-2 gap-4">
              <div>
                <label
                  for="branch"
                  class="block font-semibold mb-1 text-gray-700"
                  >Branch *</label
                >
                <select
                  id="branch"
                  class="w-full border rounded-lg p-3 input-field"
                  required
                >
                  <option value="" disabled selected>Select Branch</option>
                  <option>CSE</option>
                  <option>CE</option>
                       <option>ME</option>
                       <option>EE</option>
                       <option>ECE</option>
                </select>
                <div
                  id="branch-error"
                  class="error-message hidden"
                  aria-live="polite"
                ></div>
              </div>
              <div>
                <label
                  for="mobile"
                  class="block font-semibold mb-1 text-gray-700"
                  >Mobile Number *</label
                >
                <input
                  type="tel"
                  id="mobile"
                  class="w-full border rounded-lg p-3 input-field"
                  placeholder="10-digit mobile number"
                  pattern="[0-9]{10}"
                  required
                />
                <div
                  id="mobile-error"
                  class="error-message hidden"
                  aria-live="polite"
                ></div>
              </div>
            </div>
          </div>

          <!-- Step 2: Event Preferences -->
          <div id="step-2" class="form-step space-y-4 hidden">
            <h3 class="text-xl font-semibold text-gray-800 mb-4">
              Event Preferences
            </h3>
            <fieldset>
              <legend class="block font-semibold mb-2 text-gray-700">
                Hobbies (Select all that apply)
              </legend>
              <div class="grid grid-cols-2 gap-3" id="hobbies-container">
                <label class="flex items-center"
                  ><input
                    type="checkbox"
                    name="hobby"
                    value="Dance"
                    class="mr-2"
                  />
                  Dance</label
                >
                <label class="flex items-center"
                  ><input
                    type="checkbox"
                    name="hobby"
                    value="Singing"
                    class="mr-2"
                  />
                  Singing</label
                >
                <label class="flex items-center"
                  ><input
                    type="checkbox"
                    name="hobby"
                    value="Comedy / Mimicry"
                    class="mr-2"
                  />
                  Comedy / Mimicry</label
                >
                <label class="flex items-center"
                  ><input
                    type="checkbox"
                    name="hobby"
                    value="Poetry / Shayri"
                    class="mr-2"
                  />
                  Poetry / Shayri</label
                >
              </div>
              <div class="mt-3">
                <input
                  type="text"
                  id="hobbies-other"
                  class="w-full border rounded-lg p-3 input-field"
                  placeholder="Or specify other hobbies here..."
                />
              </div>
            </fieldset>
            <div>
              <label for="game" class="block font-semibold mb-1 text-gray-700"
                >Game Suggestion for Freshers</label
              >
              <textarea
                id="game"
                class="w-full border rounded-lg p-3 input-field"
                placeholder="Suggest games or activities for the event..."
              ></textarea>
            </div>
            <div>
              <label
                for="participate"
                class="block font-semibold mb-1 text-gray-700"
                >Do you want to Participate in anything? *</label
              >
              <select
                id="participate"
                class="w-full border rounded-lg p-3 input-field"
                required
              >
                <option value="" disabled selected>Select Option</option>
                <option>Yes</option>
                <option>No</option>
              </select>
              <div
                id="participate-error"
                class="error-message hidden"
                aria-live="polite"
              ></div>
            </div>
          </div>

          <!-- This step is not shown to the user but is part of the flow -->
          <div id="step-3" class="form-step text-center hidden"></div>

          <!-- Navigation Buttons -->
          <div class="mt-6 flex justify-between">
            <button
              type="button"
              id="prevBtn"
              class="py-2 px-6 rounded-lg btn-secondary hidden"
            >
              Previous
            </button>
            <button
              type="button"
              id="nextBtn"
              class="py-2 px-8 rounded-lg text-white btn-primary ml-auto"
            >
              Next
            </button>
          </div>
        </div>
      </form>
    </main>

    <!-- Universal Footer -->
  <div id="footer"></div> <script src="extras.js"></script>


    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("registerForm");
        const formSteps = document.querySelectorAll(".form-step");
        const stepperItems = document.querySelectorAll(".step-item");
        const nextBtn = document.getElementById("nextBtn");
        const prevBtn = document.getElementById("prevBtn");

        let currentStep = 1;

        form.addEventListener("submit", (e) => e.preventDefault());

        const updateStepper = () => {
          stepperItems.forEach((item) => {
            const step = parseInt(item.dataset.step);
            if (step < currentStep) {
              item.classList.add("active");
            } else if (step === currentStep) {
              item.classList.add("active");
            } else {
              item.classList.remove("active");
            }
          });
        };

        const showStep = (stepNumber) => {
          formSteps.forEach((step) => step.classList.add("hidden"));
          const activeStep = document.getElementById(`step-${stepNumber}`);
          activeStep.classList.remove("hidden");

          prevBtn.classList.toggle("hidden", stepNumber === 1);
          nextBtn.classList.toggle("hidden", stepNumber === formSteps.length);

          nextBtn.textContent =
            stepNumber === 2 ? "Submit & Proceed to Pay" : "Next";

          const firstInput = activeStep.querySelector(
            "input, select, textarea"
          );
          if (firstInput) {
            firstInput.focus();
          }

          updateStepper();
        };

        const showError = (field, message) => {
          const errorElement = document.getElementById(`${field.id}-error`);
          field.classList.add("is-invalid");
          errorElement.textContent = message;
          errorElement.classList.remove("hidden");
        };

        const clearError = (field) => {
          const errorElement = document.getElementById(`${field.id}-error`);
          field.classList.remove("is-invalid");
          errorElement.classList.add("hidden");
        };

        const validateStep = (stepNumber) => {
          let isValid = true;
          const currentStepFields = document.querySelectorAll(
            `#step-${stepNumber} [required]`
          );

          currentStepFields.forEach((field) => {
            clearError(field);
            if (!field.value.trim()) {
              isValid = false;
              showError(
                field,
                `${field.previousElementSibling.textContent.replace(
                  " *",
                  ""
                )} is required.`
              );
            } else if (
              field.type === "email" &&
              !/^\S+@\S+\.\S+$/.test(field.value)
            ) {
              isValid = false;
              showError(field, "Please enter a valid email address.");
            } else if (
              field.type === "tel" &&
              !/^[0-9]{10}$/.test(field.value)
            ) {
              isValid = false;
              showError(field, "Please enter a valid 10-digit mobile number.");
            }
          });
          return isValid;
        };

        prevBtn.addEventListener("click", () => {
          if (currentStep > 1) {
            currentStep--;
            showStep(currentStep);
          }
        });

        const handleFormSubmission = async () => {
          nextBtn.disabled = true;
          nextBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin mr-2"></i> Processing...';

          const transactionId = "TXN1740IFF" + Date.now();
          const checkedHobbies = Array.from(
            document.querySelectorAll('input[name="hobby"]:checked')
          ).map((cb) => cb.value);
          const otherHobby = document
            .getElementById("hobbies-other")
            .value.trim();
          if (otherHobby) checkedHobbies.push(otherHobby);

          const formData = {
            name: document.getElementById("name").value.trim(),
            email: document.getElementById("email").value.trim(),
            branch: document.getElementById("branch").value,
            mobile: document.getElementById("mobile").value.trim(),
            hobbies: checkedHobbies,
            game: document.getElementById("game").value.trim(),
            participate: document.getElementById("participate").value,
            txnId: transactionId,
          };

          try {
            // --- Step 1: Save registration details to your Vercel/Firestore backend ---
            const registrationResponse = await fetch(
              "https://freshers-8fly.vercel.app/api/submit-form",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData),
              }
            );
            if (!registrationResponse.ok)
              throw new Error(
                `Registration failed: ${registrationResponse.statusText}`
              );
            console.log("Registration data saved successfully.");

            // --- Step 2: If registration is successful, initiate the payment ---
            const paymentResponse = await fetch(
              "https://freshers-8fly.vercel.app/api/pay",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  mobileNumber: formData.mobile,
                  merchantTransactionId: formData.txnId,
                }),
              }
            );
            const paymentResult = await paymentResponse.json();

            // --- Step 3: Redirect the user to the PhonePe payment page ---
            if (paymentResult.success) {
              console.log("Redirecting to PhonePe...");
              window.location.href = paymentResult.paymentUrl;
            } else {
              throw new Error(
                paymentResult.message || "Failed to create payment request."
              );
            }
          } catch (error) {
            console.error("Submission or Payment failed:", error);
            alert(
              `An error occurred: ${error.message}. Please check your connection and try again.`
            );
            nextBtn.disabled = false;
            nextBtn.textContent = "Submit & Proceed to Pay";
          }
        };

        nextBtn.addEventListener("click", async () => {
          if (!validateStep(currentStep)) return;
          if (currentStep === 2) {
            await handleFormSubmission();
          } else {
            currentStep++;
            showStep(currentStep);
          }
        });
      });
    </script>
  </body>
</html>
